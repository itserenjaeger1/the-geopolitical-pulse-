
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Geopolitical Briefing</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --border-color: #30363d;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
        }
        header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 2rem;
            color: #f0f6fc;
        }
        .date {
            color: #8b949e;
            font-size: 0.95rem;
        }
        .grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 24px;
        }
        .source {
            display: inline-block;
            background-color: rgba(88, 166, 255, 0.15);
            color: var(--accent-color);
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        h2 {
            margin: 0 0 12px 0;
            font-size: 1.35rem;
        }
        h2 a {
            color: #f0f6fc;
            text-decoration: none;
        }
        h2 a:hover {
            color: var(--accent-color);
            text-decoration: underline;
        }
        ul {
            margin: 0;
            padding-left: 20px;
            color: #f0f6fc;
        }
        li {
            margin-bottom: 8px;
            line-height: 1.5;
            color: #b1bac4;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Socioeconomic & Geopolitical Brief</h1>
            <div class="date">Updated automatically on October 26, 2026 at 05:19 AM</div>
        </header>
        <div class="grid">
            
        </div>
    </div>
</body>
</html>
